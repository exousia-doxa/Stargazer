name: Build and Release APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Set up Python 3.13
      uses: actions/setup-python@v4
      with:
        python-version: '3.13'

    - name: Grant execute permission to gradle
      run: chmod +x OpenCamera+/opencamera-code/gradlew

    - name: Build debug APK
      run: |
        cd OpenCamera+/opencamera-code
        ./gradlew assembleDebug

    - name: Build release APK
      if: startsWith(github.ref, 'refs/tags/v')
      run: |
        cd OpenCamera+/opencamera-code
        ./gradlew assembleRelease
      env:
        KEYSTORE_FILE: ${{ secrets.KEYSTORE_FILE }}
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    - name: Upload release APK to artifacts
      if: startsWith(github.ref, 'refs/tags/v')
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: OpenCamera+/opencamera-code/app/build/outputs/apk/release/Stargazer.apk

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v1
      with:
        files: |
          OpenCamera+/opencamera-code/app/build/outputs/apk/release/Stargazer.apk
        generate_release_notes: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Test build status
      if: always()
      run: |
        if [ -f "OpenCamera+/opencamera-code/app/build/outputs/apk/release/Stargazer.apk" ]; then
          echo "✓ Release APK built successfully"
          ls -lh OpenCamera+/opencamera-code/app/build/outputs/apk/release/Stargazer.apk
        else
          echo "✗ Release APK build failed"
          exit 1
        fi
